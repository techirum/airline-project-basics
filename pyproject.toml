[project]
name = "bookingguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "techirum", email = "rumesh402@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "snowflake-connector-python[pandas]>=5.2.0",
    "xgboost>=3.2.0",
]

[project.scripts]
bookingguard = "bookingguard:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/bookingguard"
]
